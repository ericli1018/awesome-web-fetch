# Public HTTPS reverse proxy example.
# This assumes the web_fetch Compose service is reachable at 127.0.0.1:3005.

server {
    listen 443 ssl http2;
    server_name web-fetch.example.com;

    ssl_certificate     /etc/letsencrypt/live/web-fetch.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web-fetch.example.com/privkey.pem;

    client_max_body_size 512k;

    location = /mcp {
        proxy_pass http://127.0.0.1:3005/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3005/healthz;
        proxy_set_header Host $host;
    }

    # Do not expose the REST batch endpoint unless it is also required remotely.
    location / {
        return 404;
    }
}
